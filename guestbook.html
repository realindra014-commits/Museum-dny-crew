<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Buku Tamu - Museum DNY</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-stone-950 text-stone-100 min-h-screen p-4 sm:p-6 font-sans flex flex-col justify-between">
    <div class="max-w-2xl mx-auto w-full">
        
        <div class="flex justify-between items-center mb-6">
            <a href="/" class="text-amber-500 hover:underline text-sm">&larr; Kembali ke Museum</a>
            <h1 class="text-lg sm:text-xl font-bold text-amber-400 font-serif">📖 Buku Tamu Museum</h1>
        </div>

        <!-- Form Tulis Pesan Buku Tamu -->
        <div class="bg-stone-900 border border-stone-800 p-4 sm:p-5 rounded-2xl shadow-xl mb-6">
            <h2 class="text-xs font-bold text-amber-200 mb-3 uppercase tracking-wider">Tinggalkan Pesan / Kesan</h2>
            <form action="/guestbook" method="POST" class="space-y-3">
                <div>
                    <label class="block text-[11px] font-medium text-stone-300 mb-1">Nama / Panggilan</label>
                    <input type="text" name="visitor_name" required class="w-full bg-stone-950 border border-stone-800 rounded px-3 py-2 text-xs text-stone-100 focus:outline-none focus:border-amber-500" placeholder="Tulis nama Anda...">
                </div>
                <div>
                    <label class="block text-[11px] font-medium text-stone-300 mb-1">Pesan / Kesan Berkunjung</label>
                    <textarea name="message" rows="3" required class="w-full bg-stone-950 border border-stone-800 rounded px-3 py-2 text-xs text-stone-100 focus:outline-none focus:border-amber-500" placeholder="Tuliskan pesan atau kesan Anda terhadap museum ini..."></textarea>
                </div>
                <button type="submit" class="w-full bg-amber-600 hover:bg-amber-500 text-stone-950 font-bold py-2 rounded text-xs transition-colors shadow">
                    Kirim Pesan ke Buku Tamu ✍️
                </button>
            </form>
        </div>

        <!-- Daftar Pesan Buku Tamu -->
        <div class="space-y-3">
            <h2 class="text-xs font-bold text-stone-400 uppercase tracking-wider mb-2">Pesan Pengunjung</h2>
            
            {% for item in guestbook %}
            <div class="bg-stone-900/80 border border-stone-800/80 p-3.5 rounded-xl shadow">
                <div class="flex justify-between items-center mb-1.5">
                    <span class="font-bold text-xs text-amber-300">{{ item.name }}</span>
                    <span class="text-[10px] text-stone-500 font-mono">{{ item.date }}</span>
                </div>
                <p class="text-xs text-stone-300 whitespace-pre-wrap leading-relaxed">{{ item.message }}</p>
            </div>
            {% else %}
            <p class="text-stone-500 italic text-center py-8">Belum ada pesan di buku tamu. Jadilah yang pertama meninggalkan pesan!</p>
            {% endfor %}
        </div>

    </div>

    <footer class="mt-8 text-center text-[10px] text-stone-600">
        Museum DNY Crew &copy; Digital Guestbook
    </footer>
</body>
</html>
